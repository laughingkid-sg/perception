name: Refresh KrisFlyer Spontaneous Escapes

on:
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: Allow an airline's offer count to fall by more than 50% after manual review
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: krisflyer-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Scrape, validate, and open pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Test the current scraper and application
        run: npm test --workspace=krisflyer-spontaneous-escapes

      - name: Scrape both airline sources
        run: >-
          python3 krisflyer-spontaneous-escapes/scraper/scrape.py
          --output "$RUNNER_TEMP/spontaneous-escapes.json"

      - name: Validate and compare candidate data
        id: validation
        env:
          ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop }}
        run: |
          flags=()
          if [[ "$ALLOW_LARGE_DROP" == "true" ]]; then
            flags+=(--allow-large-drop)
          fi

          python3 krisflyer-spontaneous-escapes/scraper/validate_refresh.py \
            krisflyer-spontaneous-escapes/data/spontaneous-escapes.json \
            "$RUNNER_TEMP/spontaneous-escapes.json" \
            --report "$RUNNER_TEMP/refresh-report.md" \
            --result "$RUNNER_TEMP/refresh-result.json" \
            "${flags[@]}"

          cat "$RUNNER_TEMP/refresh-report.md" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$RUNNER_TEMP/refresh-result.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"changed={str(result['changed']).lower()}\n")
              output.write(f"refresh_key={result['refresh_key']}\n")
          PY

      - name: Stop when provider data is unchanged
        if: steps.validation.outputs.changed != 'true'
        run: echo "The provider data has no material changes; no pull request is needed."

      - name: Build with candidate data
        if: steps.validation.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP/spontaneous-escapes.json" \
            krisflyer-spontaneous-escapes/data/spontaneous-escapes.json
          npm run build --workspace=krisflyer-spontaneous-escapes

      - name: Commit refresh and open pull request
        if: steps.validation.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_KEY: ${{ steps.validation.outputs.refresh_key }}
        run: |
          branch="feature/krisflyer-escapes-$REFRESH_KEY"
          remote_exists=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_exists=true
          fi

          git switch -C "$branch" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/spontaneous-escapes.json" \
            krisflyer-spontaneous-escapes/data/spontaneous-escapes.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add krisflyer-spontaneous-escapes/data/spontaneous-escapes.json
          git commit -m "chore(data): refresh KrisFlyer escapes for $REFRESH_KEY"

          if [[ "$remote_exists" == "true" ]]; then
            git push --force-with-lease origin "HEAD:refs/heads/$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          body="$RUNNER_TEMP/pull-request-body.md"
          {
            echo "This pull request was generated by the manually triggered KrisFlyer refresh workflow."
            echo
            cat "$RUNNER_TEMP/refresh-report.md"
            echo
            echo "## Verification"
            echo
            echo "- Scraper and frontend tests passed."
            echo "- Candidate JSON validation passed."
            echo "- The KrisFlyer application built successfully with the candidate data."
            echo
            echo "Merge this pull request to run the normal main-branch deployment pipeline."
          } > "$body"

          pull_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$pull_number" ]]; then
            gh pr edit "$pull_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore(data): refresh KrisFlyer escapes for $REFRESH_KEY" \
              --body-file "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(data): refresh KrisFlyer escapes for $REFRESH_KEY" \
              --body-file "$body"
          fi

          pull_url=$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Created or updated: $pull_url" >> "$GITHUB_STEP_SUMMARY"
